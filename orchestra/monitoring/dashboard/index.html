<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orchestra — Live Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/sse.js"></script>
  <script defer src="/static/fleet.js"></script>
</head>
<!-- One SSE connection for the whole page: descendants refresh on sse:run_update. -->
<body hx-ext="sse" sse-connect="/api/stream">
  <div id="progress"></div>
  <div id="toasts"></div>

  <!-- ⌘K command palette (populated + driven by fleet.js) -->
  <div id="cmdk" class="cmdk" hidden>
    <div class="cmdk-box" role="dialog" aria-label="Command palette">
      <input class="cmdk-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Type a command…  (↑↓ to move, Enter to run, Esc to close)">
      <div class="cmdk-list"></div>
    </div>
  </div>
  <header>
    <div class="brand"><span class="logo">◑</span><h1>Orchestra</h1><span class="sub">live dashboard</span></div>
    <div class="head-right">
      <div class="search-wrap">
        <input class="search-in" type="search" name="q" autocomplete="off"
               placeholder="Search runs…  (try status:failed)"
               hx-get="/api/search" hx-target="#search-results" hx-swap="innerHTML"
               hx-trigger="input changed delay:250ms, search, focus">
        <div id="search-results" class="search-drop"></div>
      </div>
      <button class="cmdk-hint" type="button" title="Command palette (⌘K / Ctrl-K)" data-cmdk-open>⌘K</button>
      <span id="conn" class="conn" title="live connection">connecting…</span>
      <span id="hstatus" hx-get="/api/status" hx-trigger="load, sse:run_update, every 10s"></span>
      <details class="settings-wrap"><summary title="Settings">⚙</summary>
        <div id="settings" hx-get="/api/settings" hx-trigger="load"></div>
      </details>
    </div>
  </header>

  <!-- Results inbox: completed work surfaces here until you read it. -->
  <section class="inbox-panel">
    <div id="inbox" hx-get="/api/inbox" hx-trigger="load, sse:run_update, every 4s"></div>
    <div id="output" class="output-panel"></div>
  </section>

  <section class="fleet-panel">
    <h2>The Office</h2>
    <form class="autocast" hx-post="/api/dispatch" hx-target="#fleet" hx-swap="innerHTML">
      <input class="task-in" name="task" autocomplete="off" data-drag-task
             placeholder="Describe a task — then drag a model into its room (or auto-cast)…">
      <button>Auto-cast ✨</button>
      <button type="button" hx-post="/api/council" hx-include="[data-drag-task]" hx-target="#fleet" hx-swap="innerHTML" title="Send this task to a council of 3 free models">Council 👥</button>
    </form>
    <!-- Task board: configurable rooms; drag a model from the roster into a room. -->
    <div id="fleet" hx-get="/api/office" hx-trigger="load, sse:run_update, every 4s"></div>
    <div id="room-editor" class="room-editor-panel"></div>
    <div class="flow-panel" hx-get="/api/flow" hx-trigger="load, sse:run_update, every 5s"></div>
    <div id="chat" class="chat-panel"></div>
  </section>

  <section class="panels">
    <div class="panel chart-panel" hx-get="/api/charts" hx-trigger="load, sse:run_update, every 30s"></div>
    <div class="panel" hx-get="/api/health" hx-trigger="load, sse:run_update, every 20s"></div>
    <div class="panel" hx-get="/api/metrics" hx-trigger="load, sse:run_update, every 30s"></div>
    <div class="panel" hx-get="/api/budget" hx-trigger="load, sse:run_update, every 30s"></div>
    <div class="panel" hx-get="/api/eval" hx-trigger="load, every 30s"></div>
    <div class="panel" hx-get="/api/incidents" hx-trigger="load, sse:run_update, every 30s"></div>
  </section>

  <section class="panel hitl-panel" id="hitl" hx-get="/api/paused" hx-trigger="load, sse:run_update, every 15s"></section>

  <section class="live">
    <h2>Live feed</h2>
    <div id="feed" sse-swap="run_update" hx-swap="afterbegin"></div>
  </section>

  <section class="split">
    <div class="panel runs-panel" hx-get="/api/runs" hx-trigger="load, sse:run_update, every 15s"></div>
    <div class="panel" id="drill">Select a run to drill down…</div>
  </section>

  <section class="panel audit-panel" hx-get="/api/audit" hx-trigger="load, sse:run_update, every 20s"></section>
</body>
</html>
