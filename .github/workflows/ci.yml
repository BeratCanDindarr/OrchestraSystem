name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Correctness rules only (see [tool.ruff] in pyproject.toml): this is what catches
      # syntax that is newer than the oldest supported Python.
      - run: ruff check orchestra tests
      # The suite starts no agent CLI and asks no model (tests/conftest.py refuses both).
      # --cov applies the gate in [tool.coverage.report].
      - run: pytest -m "not slow" --cov=orchestra

  types:
    # Required: mypy has found no errors since 2026-10-22; a new one fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy orchestra/
