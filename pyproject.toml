[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "1.0.0"
description = "Multi-agent orchestration system for AI coding assistants"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Orchestra Contributors"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "requests>=2.28",
    "aiohttp>=3.9.0",
    "hnswlib>=0.8.0",
    "numpy>=1.24",          # storage/memory.py imports it directly
    "pyyaml>=6.0",
    "watchdog>=4",          # `orchestra cue start` watches files with it
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]     # mcp_fastmcp and its tests use the 1.x API
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-aiohttp>=1.0",  # aiohttp_client / aiohttp_server fixtures (federation tests)
    "httpx>=0.24",
    "mypy>=1.5",
    "ruff>=0.6",
    "mcp>=1.2,<2",
    # optional-subsystem deps the test suite imports (server.py, cue_scheduler, tracer)
    "websockets>=14",      # server.py uses the asyncio server (origins, process_request)
    "apscheduler>=3.10",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "anthropic>=0.20",      # providers/claude_sdk.py (prompt caching tests)
    "wasmtime>=20",         # toolmaker/wasm_sandbox.py
]
all = [
    "anthropic>=0.20",
    "openai>=1.10",
]

[project.scripts]
orchestra = "orchestra.cli:app"

[project.urls]
Homepage = "https://github.com/BeratCanDindarr/OrchestraSystem"
Documentation = "https://github.com/BeratCanDindarr/OrchestraSystem#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestra*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
orchestra = ["prompts/**/*.txt", "providers/*.md", "redaction/*.toml", "router/*.toml", "monitoring/dashboard/*.html", "monitoring/dashboard/*.css", "monitoring/dashboard/*.js"]

# The only pytest configuration (pytest.ini used to override this section). Coverage is opt-in:
# `pytest --cov=orchestra` measures it and applies the gate in [tool.coverage.report].
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "benchmark: marks tests as performance benchmarks",
]

# No python_version: mypy checks against the interpreter it runs on, as the installed
# stubs (numpy) are written for that one.
[tool.mypy]
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true

# Correctness rules only: syntax errors (including syntax newer than the oldest supported
# Python), undefined names, redefinitions. Style is not enforced.
[tool.ruff]
target-version = "py311"
extend-exclude = ["ForestBuildingSystem", "htmlcov"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811"]

[tool.coverage.run]
source = ["orchestra"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 60

[tool.coverage.html]
directory = "htmlcov"
