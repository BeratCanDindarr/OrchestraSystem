[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra"
version = "1.0.0"
description = "Multi-agent orchestration system for AI coding assistants"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Orchestra Contributors"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "requests>=2.28",
    "aiohttp>=3.9.0",
    "hnswlib>=0.8.0",
    "pyyaml>=6.0",
    "watchdog>=4",          # `orchestra cue start` watches files with it
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "mypy>=1.5",
    "mcp>=1.2",
    # optional-subsystem deps the test suite imports (server.py, cue_scheduler, tracer)
    "websockets>=12",
    "apscheduler>=3.10",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
all = [
    "anthropic>=0.20",
    "openai>=1.10",
    "hnswlib>=0.7",
]

[project.scripts]
orchestra = "orchestra.cli:app"

[project.urls]
Homepage = "https://github.com/orchestra-dev/orchestra"
Documentation = "https://github.com/orchestra-dev/orchestra#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestra*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
orchestra = ["prompts/**/*.txt", "redaction/*.toml", "router/*.toml", "monitoring/dashboard/*.html", "monitoring/dashboard/*.css", "monitoring/dashboard/*.js"]

# The only pytest configuration (pytest.ini used to override this section). Coverage is opt-in:
# `pytest --cov=orchestra` measures it and applies the gate in [tool.coverage.report].
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "benchmark: marks tests as performance benchmarks",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["orchestra"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 60

[tool.coverage.html]
directory = "htmlcov"
